[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flyto-modules-robotics"
version = "0.2.0"
description = "Optional robot-control modules for Flyto2 workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Flyto2" }]
keywords = ["flyto", "robotics", "workflow", "automation", "ros2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# None, and that is the point: the package is pure authoring/contract code.
# A production robot does not install it. flyto-core discovers it on an
# execution computer, but is imported only inside register_all so the pure
# request/preview APIs remain importable without the engine.
dependencies = []

[project.urls]
Homepage = "https://github.com/flytohub/flyto-modules-robotics"
Source = "https://github.com/flytohub/flyto-modules-robotics"
Issues = "https://github.com/flytohub/flyto-modules-robotics/issues"

# Discovered by flyto-core's ModuleRegistry.discover_plugins(). Installing this
# package is the only thing that makes robot motion authorable in the builder;
# a Flyto2 install without it stays pure software.
[project.entry-points."flyto.modules"]
robotics = "flyto_modules_robotics:register_all"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
