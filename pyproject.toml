[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flyto-modules-robotics"
version = "1.1.0"
description = "Robot capabilities for Flyto2, contributed through @register_module alone"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Flyto2" }]
keywords = ["flyto", "robotics", "workflow", "automation", "ros2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# None, and that is the point: the package is pure capability/contract code.
# A robot never installs it. flyto-core discovers it on the AI Space execution
# host, but is imported only inside register_all, so the package installs and
# its pure request API imports without the engine. The `core` extra states the
# floor that understands `contract=`; an older core still registers the steps
# without their contracts.
dependencies = []

[project.urls]
Homepage = "https://github.com/flytohub/flyto-modules-robotics"
Source = "https://github.com/flytohub/flyto-modules-robotics"
Issues = "https://github.com/flytohub/flyto-modules-robotics/issues"

# Discovered by flyto-core's ModuleRegistry.discover_plugins(). Installing this
# package is the only thing that makes the robot capabilities available; a
# Flyto2 install without it stays pure software.
[project.entry-points."flyto.modules"]
robotics = "flyto_modules_robotics:register_all"
# Open-RMF fleets through the same contract (flyto-robotics open_rmf.fleet).
fleet = "flyto_modules_robotics.fleet_pack:register_fleet"

[project.optional-dependencies]
core = ["flyto-core>=2.35.0"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
