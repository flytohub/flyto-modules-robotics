name: Publish to PyPI

# Same shape as flyto-core's: a tag builds, the built wheel is tested as a
# consumer would meet it, and publishing uses Trusted Publishing so no token
# lives in this repository.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_target:
        description: 'Publish target'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # SLSA provenance signing
      attestations: write  # SLSA provenance attestation storage
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Install build dependencies
        # ruff and flyto-indexer are pinned: the lint and strict
        # repository-verification steps below are the deterministic release gate,
        # so the tooling version that decides a release must not drift between runs.
        run: |
          python -m pip install --upgrade pip
          pip install build twine ruff==0.15.15 flyto-indexer==2.18.1

      - name: Lint source and tests
        run: ruff check src tests

      - name: Strict repository verification
        run: flyto-index verify . --strict

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  test:
    name: Test the built wheel
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Install the wheel
        run: pip install dist/*.whl

      - name: It imports where there is no execution engine
        # The property this package is built around: a Raspberry Pi installs it
        # for the plan builders alone and has no flyto-core at all. Asserted
        # against the built wheel, in a job that never installs flyto-core.
        run: |
          python -c "
          from importlib.metadata import version as dist_version
          import flyto_modules_robotics as pkg
          from flyto_modules_robotics.steps import plan_for_step
          installed = dist_version('flyto-modules-robotics')
          assert pkg.__version__ == installed, (pkg.__version__, installed)
          plan = plan_for_step('robotics.turn', {'degrees': 90}, robot_id='r1')
          assert plan['steps'][0]['arguments']['yaw_delta_rad'] > 0
          assert plan['steps'][-1]['capability'] == 'safe_stop'
          print('pure import and plan build:', plan['plan_id'], installed)
          "

      - name: A real flyto-core discovers it through the entry point
        # The other property, and the one a unit test cannot show: an installed
        # flyto-core must actually find this package and register its steps.
        run: |
          pip install flyto-core
          python -c "
          from core.modules.registry.core import ModuleRegistry
          plugins = ModuleRegistry.discover_plugins(force=True)
          assert 'robotics' in plugins, plugins
          ids = sorted(m for m in ModuleRegistry._modules if m.startswith('robotics.'))
          assert ids == ['robotics.move', 'robotics.stop', 'robotics.turn'], ids
          print('discovered:', ids)
          "

      - name: Run the suite against the installed package
        run: |
          pip install pytest
          pytest tests/ -q -o addopts=""

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_target == 'testpypi'
    environment:
      name: testpypi
      url: https://test.pypi.org/project/flyto-modules-robotics/
    permissions:
      id-token: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: [build, test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_target == 'pypi')
    environment:
      name: pypi
      url: https://pypi.org/project/flyto-modules-robotics/
    permissions:
      id-token: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
